name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Lutra.slnx
      - run: dotnet build Lutra.slnx --configuration Release --no-restore
      - run: dotnet test Lutra.slnx --configuration Release --no-build --logger trx

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Start PostgreSQL
        run: |
          docker run -d --name lutra-smoke-db \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke postgres:17-alpine
          # The image restarts the server once during initialization; only the
          # final instance listens on TCP, so probe 127.0.0.1 rather than the socket.
          for attempt in $(seq 1 60); do
            if docker exec lutra-smoke-db pg_isready -h 127.0.0.1 -U postgres -d smoke; then
              break
            fi
            sleep 1
          done
          docker exec lutra-smoke-db psql -U postgres -d smoke -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE smoke (id integer PRIMARY KEY); INSERT INTO smoke VALUES (1), (2), (3);"
      - name: Create smoke configuration
        run: |
          mkdir -p "$RUNNER_TEMP/lutra-backups"
          cat > "$RUNNER_TEMP/lutra.yaml" <<EOF
          backup_directory: $RUNNER_TEMP/lutra-backups
          retention:
            max_count: 3
            max_age_days: 7
          databases:
            - name: smoke-a
              type: postgresql
              container: lutra-smoke-db
              database: smoke
              username: postgres
              schedule: daily
            - name: smoke-b
              type: postgresql
              container: lutra-smoke-db
              database: smoke
              username: postgres
              schedule: daily
          EOF
      - name: Run CLI smoke tests
        run: |
          dotnet build src/Lutra.CLI/Lutra.CLI.csproj --configuration Release
          lutra_cli="src/Lutra.CLI/bin/Release/net10.0/Lutra.CLI.dll"
          dotnet "$lutra_cli" config validate --config "$RUNNER_TEMP/lutra.yaml" | tee "$RUNNER_TEMP/validate.out"
          grep -q "State directory compatibility fallback" "$RUNNER_TEMP/validate.out"
          grep -q "writable (SQLite WAL)" "$RUNNER_TEMP/validate.out"

          set +e
          dotnet "$lutra_cli" backup run --target smoke-a --config "$RUNNER_TEMP/lutra.yaml" > "$RUNNER_TEMP/smoke-a.out" 2>&1 &
          pid_a=$!
          dotnet "$lutra_cli" backup run --target smoke-b --config "$RUNNER_TEMP/lutra.yaml" > "$RUNNER_TEMP/smoke-b.out" 2>&1 &
          pid_b=$!
          wait "$pid_a"
          status_a=$?
          wait "$pid_b"
          status_b=$?
          set -e
          cat "$RUNNER_TEMP/smoke-a.out" "$RUNNER_TEMP/smoke-b.out"
          test "$status_a" -eq 0
          test "$status_b" -eq 0
          ! grep -i "busy" "$RUNNER_TEMP/smoke-a.out" "$RUNNER_TEMP/smoke-b.out"

          dotnet "$lutra_cli" history --config "$RUNNER_TEMP/lutra.yaml" | tee "$RUNNER_TEMP/history.out"
          grep -q "smoke-a" "$RUNNER_TEMP/history.out"
          grep -q "smoke-b" "$RUNNER_TEMP/history.out"
          test "$(grep -c 'OK' "$RUNNER_TEMP/history.out")" -eq 2

          dotnet "$lutra_cli" backup list --config "$RUNNER_TEMP/lutra.yaml"
          dotnet "$lutra_cli" cleanup --dry-run --config "$RUNNER_TEMP/lutra.yaml"

          # Restore the dump into a temporary database and count its tables.
          dotnet "$lutra_cli" verify --target smoke-a --config "$RUNNER_TEMP/lutra.yaml" | tee "$RUNNER_TEMP/verify.out"
          grep -q "Verification passed" "$RUNNER_TEMP/verify.out"
          grep -q "contains 1 user tables" "$RUNNER_TEMP/verify.out"

  release-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish and verify release layout
        run: |
          dotnet publish src/Lutra.CLI/Lutra.CLI.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained -p:PublishSingleFile=true -o publish
          test -x publish/Lutra.CLI
          mv publish/Lutra.CLI publish/lutra
          tar -czf lutra-${{ matrix.rid }}.tar.gz -C publish lutra
          test "$(tar -tzf lutra-${{ matrix.rid }}.tar.gz)" = "lutra"

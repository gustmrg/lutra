worker_processes 1;
pid tmp/nginx.pid;
error_log stderr;

events {
    worker_connections 32;
}

http {
    access_log off;
    client_body_temp_path tmp/client;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    server {
        listen 8080;
        location /health {
            return 200 "ok\n";
        }
    }
}
